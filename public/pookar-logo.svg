<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#040814" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Circular Badge Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="240" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Main Emblem Group -->
  <g fill="url(#goldGrad)" transform="translate(0, 10)">
    
    <!-- Central Dome Spire & Finial -->
    <path d="M256,70 L256,110 M252,90 L260,90" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <circle cx="256" cy="66" r="5" fill="#ffffff" />

    <!-- Main Cupola Dome -->
    <path d="M214,142 C214,102 298,102 298,142 Z" fill="#ffffff" />
    <path d="M210,142 L302,142 L302,148 L210,148 Z" fill="#cbd5e1" />

    <!-- Dome Drum & Arch Layer -->
    <path d="M140,210 C140,145 372,145 372,210 Z" fill="#ffffff" opacity="0.95" />
    <path d="M130,210 L382,210 L382,218 L130,218 Z" fill="#94a3b8" />

    <!-- Classical Architectural Columns & Portico -->
    <!-- Center Pediment -->
    <polygon points="206,218 306,218 256,192" fill="#0f172a" />
    <polygon points="212,216 300,216 256,195" fill="#ffffff" />

    <!-- Colonnade Pillars -->
    <rect x="156" y="222" width="10" height="64" rx="2" fill="#0f172a" />
    <rect x="176" y="222" width="10" height="64" rx="2" fill="#0f172a" />
    <rect x="196" y="222" width="10" height="64" rx="2" fill="#0f172a" />
    <rect x="216" y="222" width="12" height="64" rx="2" fill="#0f172a" />
    <rect x="238" y="222" width="12" height="64" rx="2" fill="#0f172a" />
    <rect x="262" y="222" width="12" height="64" rx="2" fill="#0f172a" />
    <rect x="284" y="222" width="12" height="64" rx="2" fill="#0f172a" />
    <rect x="306" y="222" width="10" height="64" rx="2" fill="#0f172a" />
    <rect x="326" y="222" width="10" height="64" rx="2" fill="#0f172a" />
    <rect x="346" y="222" width="10" height="64" rx="2" fill="#0f172a" />

    <!-- Column Base Plinth -->
    <path d="M120,286 L392,286 L392,294 L120,294 Z" fill="#ffffff" />

    <!-- Symmetrical Left & Right Angular Tool / Wing Flanks -->
    <path d="M68,168 L114,204 L84,298 L160,332 L150,354 L60,312 L44,286 Z" fill="#ffffff" />
    <circle cx="88" cy="276" r="7" fill="#0f172a" />

    <path d="M444,168 L398,204 L428,298 L352,332 L362,354 L452,312 L468,286 Z" fill="#ffffff" />
    <circle cx="424" cy="276" r="7" fill="#0f172a" />

    <!-- Central Interlocking Partnership Handshake -->
    <path d="M142,342 L200,312 L228,348 L170,378 Z" fill="#ffffff" />
    <path d="M370,342 L274,310 L226,358 L270,404 L318,368 Z" fill="#ffffff" />

    <!-- Left Hand Gripping Fingers -->
    <rect x="180" y="322" width="46" height="18" rx="9" transform="rotate(38 180 322)" fill="#ffffff" stroke="#0f172a" stroke-width="4" />
    <rect x="194" y="340" width="48" height="18" rx="9" transform="rotate(38 194 340)" fill="#ffffff" stroke="#0f172a" stroke-width="4" />
    <rect x="210" y="358" width="48" height="18" rx="9" transform="rotate(38 210 358)" fill="#ffffff" stroke="#0f172a" stroke-width="4" />
    <rect x="226" y="376" width="48" height="18" rx="9" transform="rotate(38 226 376)" fill="#ffffff" stroke="#0f172a" stroke-width="4" />

    <path d="M236,412 C256,432 276,416 294,394 L266,366 Z" fill="#ffffff" stroke="#0f172a" stroke-width="4" />
  </g>
</svg>
